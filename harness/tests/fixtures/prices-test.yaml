# SYNTHETIC price list — for the cost tests only.
#
# The numbers below are invented to make the cost arithmetic checkable. They are
# not a price list, they are not quoted from any provider, and they are never
# read by a run: the shipped prices.yaml carries no figure at all, and this file
# lives under tests/fixtures/.
