# Field-name aliases — shared normalisation
#
# Charter section 5.3: normalisation is one shared function applied identically
# to every system's output, and it is published with the harness. This file is
# part of that function. It is applied to a large language model's answer and to
# a document service's answer in exactly the same way, so no system gets a
# mapping another does not.
#
# The rule: a returned key that is not a schema field is looked up here, and if
# the alias resolves to a schema field the document does not already carry a
# value for, the value moves to that field. Matching is case-insensitive and
# ignores spaces, hyphens and underscores. An alias that resolves to a field the
# system already returned is left alone and counted as an out-of-schema return.
#
# Version 1.0.0. Adding an alias can move a figure, so it is a major harness
# version under charter section 7.1.

version: "1.0.0"

