[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "entail-bench"
version = "1.0.0"
description = "Evaluation harness for the Entailment Labs benchmark suites. Messy Scan is implemented."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Entailment Labs" }]
keywords = ["benchmark", "document-extraction", "evaluation", "calibration"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "PyYAML>=6.0",
  "httpx>=0.27",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
gcp = ["google-cloud-documentai>=2.20"]
dev = ["pytest>=8.0"]

[project.scripts]
entail-bench = "entail_bench.cli:main"

[project.urls]
Homepage = "https://github.com/nagu-io/benchmarks"
Source = "https://github.com/nagu-io/benchmarks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
entail_bench = ["data/*.yaml", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
